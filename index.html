<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quickstep Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav>
        <h1>Quickstep</h1>
        <button class="tab-btn active" onclick="showTab(event, 'sites')">Sites</button>
        <button class="tab-btn" onclick="showTab(event, 'dm')">Direct Messages</button>
        <button class="tab-btn" onclick="showTab(event, 'friends')">Friend Requests</button>
        <button class="tab-btn" onclick="showTab(event, 'social')">Social Media</button>
    </nav>

    <main>
        <!-- SITES SECTION -->
        <section id="sites" class="content-section active">
            <h2>Your Sites</h2>
            <button class="btn-create" onclick="createSite()">+ Create New Wiki</button>
            <div id="sites-list"></div> <!-- JavaScript fills this -->
        </section>

        <!-- DM SECTION -->
        <section id="dm" class="content-section">
            <h2>Direct Messages</h2>
            <p>Your messages will appear here.</p>
        </section>

        <!-- FRIENDS SECTION -->
        <section id="friends" class="content-section">
            <h2>Friend Requests</h2>
            <p>No new requests.</p>
        </section>

        <!-- SOCIAL SECTION -->
        <section id="social" class="content-section">
            <h2>Social Media</h2>
            <p>Activity feed coming soon...</p>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
