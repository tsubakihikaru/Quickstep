name: Create New Wiki Site
on:
  workflow_dispatch:
    inputs:
      site_id:
        description: 'Folder name for the wiki (e.g., my-wiki)'
        required: true
      site_name:
        description: 'Display name for the wiki (e.g., My Awesome Wiki)'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create folder and index file
        run: |
          mkdir -p ${{ github.event.inputs.site_id }}
          echo "<html><body><h1>${{ github.event.inputs.site_name }}</h1><p>Welcome to your new wiki!</p></body></html>" > ${{ github.event.inputs.site_id }}/index.html

      - name: Update sites.json
        run: |
          # Uses 'jq' to add the new site to your JSON database
          jq '. += [{"id": "${{ github.event.inputs.site_id }}", "name": "${{ github.event.inputs.site_name }}", "url": "./${{ github.event.inputs.site_id }}/"}]' sites.json > tmp.json && mv tmp.json sites.json

      - name: Commit and Push changes
        run: |
          git config --global user.name "Quickstep Bot"
          git config --global user.email "bot@quickstep.com"
          git add .
          git commit -m "Create new wiki: ${{ github.event.inputs.site_id }}"
          git push
